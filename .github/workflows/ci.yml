name: Build and deploy
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifact-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/artifact-plane/package-lock.json
      - run: npm ci
        working-directory: apps/artifact-plane
      - run: npm test
        working-directory: apps/artifact-plane
      - run: npm run build
        working-directory: apps/artifact-plane
      - run: npx playwright install --with-deps chromium
        working-directory: apps/artifact-plane
      - run: npm run test:browser
        working-directory: apps/artifact-plane
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/artifact-plane/package-lock.json
      # The ADD bundle embeds the built validator, so build it before the Go
      # tests and the release binaries.
      - run: npm ci
        working-directory: apps/artifact-plane
      - run: npm run build:validator
        working-directory: apps/artifact-plane
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - name: Build portable binaries
        shell: bash
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            suffix=""
            if [ "$GOOS" = windows ]; then suffix=".exe"; fi
            CGO_ENABLED=0 go build -trimpath -o "dist/se-adopt-${GOOS}-${GOARCH}${suffix}" ./cmd/se-adopt
          done
          cd dist
          sha256sum se-adopt-* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: se-adopt
          path: dist/
          if-no-files-found: error
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          path: website/build
  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [go, docs]
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [go, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: se-adopt
          path: dist
      - name: Publish binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "se-adopt $RELEASE_TAG"
