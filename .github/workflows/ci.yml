name: Build and deploy
on:
  push:
    branches: [main, master]
    tags: ['v*', 'plane-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifact-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/artifact-plane/package-lock.json
      - run: npm ci
        working-directory: apps/artifact-plane
      - run: npm test
        working-directory: apps/artifact-plane
      - run: npm run build
        working-directory: apps/artifact-plane
      - run: npx playwright install --with-deps chromium
        working-directory: apps/artifact-plane
      - run: npm run test:browser
        working-directory: apps/artifact-plane
  plane-app:
    # One single executable application of the Plane for each target, built and
    # started on its own runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-amd64, runner: ubuntu-24.04, file: artifact-plane-linux-amd64 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, file: artifact-plane-linux-arm64 }
          - { target: darwin-arm64, runner: macos-15, file: artifact-plane-darwin-arm64 }
          - { target: darwin-amd64, runner: macos-15-intel, file: artifact-plane-darwin-amd64 }
          - { target: windows-amd64, runner: windows-2025, file: artifact-plane-windows-amd64.exe }
          - { target: windows-arm64, runner: windows-11-arm, file: artifact-plane-windows-arm64.exe }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: apps/artifact-plane
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: apps/artifact-plane/package-lock.json
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npm run build:app
      # The smoke check opens this checkout (the repository root) with the explore route.
      - run: node scripts/app-smoke.mjs "release/${{ matrix.file }}"
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-plane-${{ matrix.target }}
          path: apps/artifact-plane/release/${{ matrix.file }}
          if-no-files-found: error
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/artifact-plane/package-lock.json
      # The ADD bundle embeds the built validator, so build it before the Go
      # tests and the release binaries.
      - run: npm ci
        working-directory: apps/artifact-plane
      - run: npm run build:validator
        working-directory: apps/artifact-plane
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - name: Build portable binaries
        shell: bash
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            suffix=""
            if [ "$GOOS" = windows ]; then suffix=".exe"; fi
            CGO_ENABLED=0 go build -trimpath -o "dist/se-adopt-${GOOS}-${GOARCH}${suffix}" ./cmd/se-adopt
          done
          cd dist
          sha256sum se-adopt-* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: se-adopt
          path: dist/
          if-no-files-found: error
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          path: website/build
  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [go, docs]
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [go, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: se-adopt
          path: dist
      - name: Publish binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "se-adopt $RELEASE_TAG"
  plane-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/plane-v')
    needs: [artifact-plane, plane-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - name: Check the tag against the package version and current_version
        run: node apps/artifact-plane/scripts/check-release-version.mjs "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          pattern: artifact-plane-*
          path: plane-release
          merge-multiple: true
      - name: Write checksums
        working-directory: plane-release
        run: sha256sum artifact-plane-* > SHA256SUMS
      - name: Publish the Plane files and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" plane-release/* --verify-tag --generate-notes --title "Artifact Plane ${GITHUB_REF_NAME#plane-v}"
